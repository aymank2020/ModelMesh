[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "modelmesh"
version = "0.4.0"
description = "Constraint satisfaction solver with arc consistency, backjumping, and nogood learning"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [{name = "ayman kamel", email = "ayman@openclaw.dev"}]
keywords = ["constraint-programming", "csp", "arc-consistency", "backtracking", "scheduling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/aymank2020/ModelMesh"
Repository = "https://github.com/aymank2020/ModelMesh"
Issues = "https://github.com/aymank2020/ModelMesh/issues"

[project.scripts]
modelmesh = "modelmesh.cli.runner:run_cli"

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-cov==5.0.0",
    "hypothesis==6.112.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
modelmesh = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["modelmesh"]

[tool.coverage.report]
fail_under = 80
